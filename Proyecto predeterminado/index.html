<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodControl - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="brand-mark" data-icon="logo"></div>
                <h1>FoodControl</h1>
                <p>Sistema de Administración de Restaurantes</p>
            </div>
            
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ingrese su usuario" autocomplete="username">
                    <div class="error-message" id="usernameError"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" autocomplete="current-password">
                    <div class="error-message" id="passwordError"></div>
                </div>
                
                <button type="submit" class="btn">Iniciar Sesión</button>
                <div class="error-message" id="loginError"></div>
            </form>
            
            <div class="demo-credentials">
                <p><strong>Acceso de demostración:</strong></p>
                <p>Usuario: <strong>admin</strong></p>
                <p>Contraseña: <strong>admin123</strong></p>
                <p style="margin-top: 0.5rem; font-style: italic;">*Esta versión es académica y utiliza almacenamiento local.</p>
            </div>
        </div>
    </div>
    
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
